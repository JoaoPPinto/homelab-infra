---
- name: Create Minio group
  group:
    name: "{{ minio_group }}"
    state: present

- name: Create Minio user
  user:
    name: "{{ minio_user }}"
    group: "{{ minio_group }}"
    system: "yes"
    shell: "/usr/sbin/nologin"

- name: Create the Minio data storage directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ minio_user }}"
    group: "{{ minio_group }}"
    mode: 0750
  with_items: "{{ minio_server_datadirs }}"

- name: Download latest MinIO release
  get_url:
    url: "{{ minio_server_url }}/minio"
    dest: "{{ minio_server_bin }}"
    owner: "root"
    group: "root"
    mode: 0755
    checksum: "sha256:{{ lookup('url', minio_server_url + '/minio.sha256sum').split(' ')[0] }}"
  when: minio_update

- name: Template Minio Server Config file
  template:
    src: minio.env.j2
    dest: /etc/default/minio
    owner: root
    group: "{{ minio_group }}"
    mode: 0640
  notify: restart minio

- name: Create the Minio server systemd unit
  template:
    src: minio.service.j2
    dest: /etc/systemd/system/minio.service
    owner: root
    group: root

- name: Enable and start the Minio service
  service:
    name: minio
    state: started
    enabled: true
