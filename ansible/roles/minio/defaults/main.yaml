---
minio_base_url: "https://dl.minio.io"
minio_server_url: "{{ minio_base_url }}/server/minio/release/linux-amd64"
minio_client_url: "{{ minio_base_url }}/client/mc/release/linux-amd64"

minio_server_bin: /usr/local/bin/minio
minio_client_bin: /usr/local/bin/mc

minio_server_datadirs:
  - /mnt/storage/minio
minio_server_addr: ":9091"
minio_server_console_addr: ":9080"

minio_root_user: "admin"

minio_user: minio
minio_group: minio
minio_update: false
